pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,mjs,js,json,jsonc,css,md,yml,yaml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,mjs,js}"
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
